<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dance Studio Messenger</title>
    <!-- "Stage, warmed" type ramp — see src/styles/tokens.css.
         Loaded here (not @import in CSS) so both families are already
         in flight before the app's CSS parses, for a faster first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <!-- OneSignal Web Push (Task 28) — the browser counterpart to the
         Despia native bridge in AuthProvider.tsx. Same App ID, same
         person.id-as-external-id convention. Loading this here is a no-op
         until AuthProvider actually calls OneSignal.login()/
         requestPermission() for a confirmed person. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(function (OneSignal) {
        OneSignal.init({
          appId: "689ecc47-032f-4bc5-99b6-ed1cef09fc21",
          serviceWorkerPath: "/OneSignalSDKWorker.js",
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
